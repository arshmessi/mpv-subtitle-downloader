name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pyinstaller --onefile --paths src --name mpv-subtitle scripts/entrypoint.py
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-package | Out-Null
          Copy-Item dist/mpv-subtitle.exe release-package/
          Copy-Item -Recurse mpv release-package/
          Copy-Item README.md,LICENSE,CHANGELOG.md release-package/
          Compress-Archive -Path release-package/* -DestinationPath mpv-subtitle-windows.zip -Force
      - uses: softprops/action-gh-release@v2
        with:
          files: mpv-subtitle-windows.zip
