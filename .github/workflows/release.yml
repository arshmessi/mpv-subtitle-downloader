name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pyinstaller --onefile --paths src --name mpv-subtitle scripts/entrypoint.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/mpv-subtitle.exe
