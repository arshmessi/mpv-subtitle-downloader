name: Windows build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pyinstaller --onefile --paths src --name mpv-subtitle scripts/entrypoint.py
      - uses: actions/upload-artifact@v4
        with:
          name: mpv-subtitle-windows
          path: dist/mpv-subtitle.exe
